<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #fafafa;
            color: #262626;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 0;
        }

        .container {
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Card 1: Login Box */
        .card {
            background: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 30px 40px 20px;
            text-align: center;
        }

        .logo-container {
            margin-bottom: 24px;
            display: flex;
            justify-content: center;
        }

        .logo-svg {
            width: 175px;
            height: auto;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field-group {
            position: relative;
            width: 100%;
        }

        .input-field {
            width: 100%;
            height: 38px;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            padding: 9px 8px 7px;
            font-size: 12px;
            color: #262626;
            outline: none;
        }

        .input-field:focus {
            border-color: #a8a8a8;
        }

        .toggle-password {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #262626;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            display: none;
        }

        .btn-submit {
            width: 100%;
            height: 32px;
            margin-top: 8px;
            border: none;
            border-radius: 8px;
            background-color: #0095f6;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            opacity: 0.7;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .btn-submit.active {
            opacity: 1;
            pointer-events: auto;
        }

        .btn-submit.active:hover {
            background-color: #1877f2;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0 18px;
        }

        .divider .line {
            flex-grow: 1;
            height: 1px;
            background-color: #dbdbdb;
        }

        .divider .text {
            color: #8e8e8e;
            font-size: 12px;
            font-weight: 600;
            margin: 0 18px;
            text-transform: uppercase;
        }

        .fb-login {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #385185;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            margin-bottom: 16px;
        }

        .forgot-link {
            display: block;
            color: #00376b;
            font-size: 12px;
            text-decoration: none;
            margin-top: 12px;
        }

        /* Card 2: Signup Box */
        .signup-box {
            background: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 20px;
            text-align: center;
            font-size: 14px;
        }

        .signup-box a {
            color: #0095f6;
            font-weight: 600;
            text-decoration: none;
        }

        /* Awareness / Training Message */
        .message-box {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            background: #fff3cd;
            border: 1px solid #ffe69c;
            color: #664d03;
            font-size: 12px;
            text-align: right;
            direction: rtl;
            line-height: 1.5;
        }

        .footer-text {
            margin-top: 24px;
            font-size: 12px;
            color: #8e8e8e;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Card 1: Login Form -->
    <div class="card">
        
        <!-- Instagram Text Logo -->
        <div class="logo-container">
            <svg class="logo-svg" viewBox="0 0 175 51" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M11 15C11 12.2386 13.2386 10 16 10H159C161.761 10 164 12.2386 164 15V36C164 38.7614 161.761 41 159 41H16C13.2386 41 11 38.7614 11 36V15Z" fill="white"/>
                <path d="M43.8 28.5c0 5.4-3.6 8.7-8.7 8.7-5.2 0-8.7-3.3-8.7-8.7 0-5.5 3.5-8.8 8.7-8.8 5.1 0 8.7 3.3 8.7 8.8zm-4.3 0c0-3.3-1.8-5.2-4.4-5.2s-4.4 1.9-4.4 5.2c0 3.2 1.8 5.2 4.4 5.2s4.4-2 4.4-5.2zm11.7 8.4h-4V20h4v16.9zm-2-18.9c-1.4 0-2.5-1.1-2.5-2.5s1.1-2.5 2.5-2.5 2.5 1.1 2.5 2.5-1.1 2.5-2.5 2.5zm27 10.5c0 5.4-3.6 8.7-8.7 8.7-5.2 0-8.7-3.3-8.7-8.7 0-5.5 3.5-8.8 8.7-8.8 5.1 0 8.7 3.3 8.7 8.8zm-4.3 0c0-3.3-1.8-5.2-4.4-5.2s-4.4 1.9-4.4 5.2c0 3.2 1.8 5.2 4.4 5.2s4.4-2 4.4-5.2zm20.3-8.5v1.2c-.8-1-2.1-1.5-3.6-1.5-3.8 0-6.9 2.9-6.9 8.6 0 5.8 3.1 8.7 6.9 8.7 1.6 0 2.8-.5 3.6-1.6v1.3c0 2.7-1.6 4.3-4.1 4.3-1.8 0-3.1-.8-3.6-2l-3.5 1.4c1 2.4 3.4 4.1 7.1 4.1 4.4 0 7.8-2.5 7.8-8.2V20h-3.7zm-.3 8.5c0 3.2-1.7 5.2-4.1 5.2s-4.1-1.9-4.1-5.2c0-3.3 1.7-5.2 4.1-5.2s4.1 1.9 4.1 5.2zM21.5 36.9h-4V13.8h4v23.1zm84.2-16.9h-4v2.2c-.9-1.5-2.5-2.5-4.6-2.5-4.5 0-7.7 3.5-7.7 8.7 0 5.3 3.2 8.7 7.7 8.7 2.1 0 3.7-1 4.6-2.5v2.2h4V20zm-4 8.5c0 3.2-1.8 5.2-4.3 5.2-2.6 0-4.3-1.9-4.3-5.2 0-3.3 1.8-5.2 4.3-5.2 2.5 0 4.3 2 4.3 5.2zm23.3-8.5h-3.8v2.4c-.8-1.7-2.6-2.7-4.7-2.7-4.2 0-7.3 3.3-7.3 8.7 0 5.3 3.1 8.7 7.3 8.7 2.1 0 3.9-1 4.7-2.7v2.4h3.8V20zm-4 8.5c0 3.2-1.7 5.2-4.1 5.2s-4.1-1.9-4.1-5.2c0-3.3 1.7-5.2 4.1-5.2s4.1 1.9 4.1 5.2zm20.8-8.5h-3.8v2.2c-.8-1.5-2.3-2.5-4.3-2.5-2.1 0-3.8 1-4.7 2.6-.8-1.6-2.5-2.6-4.5-2.6-2 0-3.5 1-4.3 2.3V20h-3.7v16.9h3.8V28.4c0-2.8 1.4-4.7 3.4-4.7 2 0 3.1 1.4 3.1 3.8v9.4h3.8V28.4c0-2.8 1.4-4.7 3.4-4.7 2 0 3.1 1.4 3.1 3.8v9.4h3.8V20z" fill="#262626"/>
            </svg>
        </div>

        <!-- Form -->
        <form id="loginForm">
            <div class="field-group">
                <input 
                    type="text" 
                    id="username" 
                    class="input-field" 
                    placeholder="Phone number, username, or email" 
                    autocomplete="off"
                >
            </div>

            <div class="field-group">
                <input 
                    type="password" 
                    id="password" 
                    class="input-field" 
                    placeholder="Password" 
                    autocomplete="off"
                >
                <button type="button" id="togglePassword" class="toggle-password">Show</button>
            </div>

            <button type="submit" id="loginBtn" class="btn-submit">Log in</button>
        </form>

        <div class="divider">
            <div class="line"></div>
            <div class="text">OR</div>
            <div class="line"></div>
        </div>

        <a href="#" class="fb-login" onclick="return false;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="#385185">
                <path d="M22.675 0h-21.35c-.732 0-1.325.593-1.325 1.325v21.351c0 .731.593 1.324 1.325 1.324h11.495v-9.294h-3.128v-3.622h3.128v-2.671c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.795.143v3.24l-1.918.001c-1.504 0-1.795.715-1.795 1.763v2.313h3.587l-.467 3.622h-3.12v9.293h6.116c.73 0 1.323-.593 1.323-1.325v-21.35c0-.732-.593-1.325-1.325-1.325z"/>
            </svg>
            Log in with Facebook
        </a>

        <a href="#" class="forgot-link" onclick="return false;">Forgot password?</a>

        <!-- Training Notice Message -->
        <div id="message" class="message-box">
            ⚠️ <strong>تنبيه — هذه صفحة تجريبية توعوية.</strong>
            <br>
            لا تقم بإدخال معلومات حساسة أو كلمات مرور الحسابات الحقيقية على مواقع غير متحقق منها.
        </div>

    </div>

    <!-- Card 2: Sign Up Offer -->
    <div class="signup-box">
        Don't have an account? <a href="#" onclick="return false;">Sign up</a>
    </div>

    <div class="footer-text">
        Educational Training Demo
    </div>

</div>

<script>
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const togglePasswordBtn = document.getElementById('togglePassword');
    const loginForm = document.getElementById('loginForm');
    const messageBox = document.getElementById('message');

    // 1. Enable/Disable Login Button based on input
    function checkInputs() {
        if (usernameInput.value.trim().length > 0 && passwordInput.value.trim().length >= 6) {
            loginBtn.classList.add('active');
        } else {
            loginBtn.classList.remove('active');
        }

        // Toggle "Show" button visibility
        if (passwordInput.value.length > 0) {
            togglePasswordBtn.style.display = 'block';
        } else {
            togglePasswordBtn.style.display = 'none';
        }
    }

    usernameInput.addEventListener('input', checkInputs);
    passwordInput.addEventListener('input', checkInputs);

    // 2. Show / Hide Password Feature
    togglePasswordBtn.addEventListener('click', function() {
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            togglePasswordBtn.textContent = 'Hide';
        } else {
            passwordInput.type = 'password';
            togglePasswordBtn.textContent = 'Show';
        }
    });

    // 3. Handle Form Submit (Training Purposes Only)
    loginForm.addEventListener('submit', function(event) {
        event.preventDefault();

        // Show the awareness message
        messageBox.style.display = 'block';

        // Clear input field values securely
        usernameInput.value = '';
        passwordInput.value = '';
        checkInputs();
    });
</script>

</body>
</html>
