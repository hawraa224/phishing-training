<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            margin: 0;
            background-color: #fafafa;
            color: #262626;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Card 1: Login Box */
        .card {
            background: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 8px; /* softer, cleaner radius */
            padding: 40px 40px 25px;
            text-align: center;
            box-shadow: 0 1px 1px rgba(0,0,0,0.05); /* very subtle shadow */
        }

        .logo-container {
            margin-bottom: 25px; /* balanced spacing */
            display: flex;
            justify-content: center;
        }

        .logo-svg {
            width: 80px;
            height: 80px;
        }

        /* Title text */
        .page-title {
            font-size: 28px;
            font-weight: 600; /* slightly thinner than before */
            color: #262626;
            margin-bottom: 30px;
            text-align: center;
        }

        /* Form Controls */
        form {
            display: flex;
            flex-direction: column;
            gap: 10px; /* spacing between fields */
        }

        .input-field {
            width: 100%;
            height: 38px;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            padding: 9px 8px 7px;
            font-size: 14px; /* improved readability */
            color: #262626;
            outline: none;
        }

        .input-field::placeholder {
            color: #8e8e8e;
        }

        .input-field:focus {
            border-color: #a8a8a8;
        }

        .btn-submit {
            width: 100%;
            height: 38px; /* matching input height */
            margin-top: 15px; /* more separation */
            border: none;
            border-radius: 8px;
            background-color: #0095f6;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.1s ease;
        }

        .btn-submit:hover {
            background-color: #0056b3;
        }

        .forgot-container {
            margin-top: 18px;
            text-align: center;
        }

        .forgot {
            color: #00376b; /* darker blue as in image_8.png */
            font-size: 14px; /* match image */
            font-weight: 500;
            text-decoration: none;
        }

        /* Message */
        .message {
            display: none;
            margin-top: 25px;
            padding: 15px;
            border: 1px solid #cfe5ff;
            border-radius: 8px;
            background: #f1f8ff;
            color: #245;
            font-size: 12px;
            text-align: right;
            direction: rtl;
            line-height: 1.6;
        }

        /* Integrated Training Notice */
        .training-note-container {
            margin-top: 30px;
            border-top: 1px solid #efefef; /* separator */
            padding-top: 20px;
            text-align: center;
        }

        .training-note {
            font-size: 12px;
            color: #737373;
            line-height: 1.6;
            max-width: 250px;
            margin: 0 auto; /* center */
        }

        /* Footer */
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="page">
    <div class="main">

        <!-- Card 1: Login Form -->
        <div class="card">
            
            <!-- Instagram Icon with exact colors and notification dot -->
            <div class="logo-container">
                <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Exact Instagram orange-purple radial gradient -->
                        <radialGradient id="instaGrad" cx="30%" cy="107%" r="120%" fx="30%" fy="107%">
                            <stop offset="0%" stop-color="#fdf497" />
                            <stop offset="10%" stop-color="#fdf497" />
                            <stop offset="45%" stop-color="#fd5949" />
                            <stop offset="60%" stop-color="#d6249f" />
                            <stop offset="90%" stop-color="#285AEB" />
                        </radialGradient>
                    </defs>

                    <!-- Background Rounded Square -->
                    <rect width="100" height="100" rx="26" fill="url(#instaGrad)" />

                    <!-- Outer Camera Line -->
                    <rect x="23" y="23" width="54" height="54" rx="15" fill="none" stroke="#ffffff" stroke-width="7" />

                    <!-- Center Camera Circle -->
                    <circle cx="50" cy="50" r="14" fill="none" stroke="#ffffff" stroke-width="7" />

                    <!-- Notification Dot (added in corner) -->
                    <circle cx="71.5" cy="28.5" r="4.5" fill="#ffffff" />
                </svg>
            </div>

            <!-- Page Title restored to Instagram -->
            <div class="page-title">Instagram</div>

            <!-- Form -->
            <form id="loginForm">
                <input
                    type="text"
                    id="username"
                    class="input-field"
                    placeholder="Phone number, username, or email"
                    autocomplete="off"
                    required
                >

                <input
                    type="password"
                    id="password"
                    class="input-field"
                    placeholder="Password"
                    autocomplete="off"
                    required
                >

                <button type="submit" class="btn-submit">Log in</button>
            </form>

            <div class="forgot-container">
                <a href="#" class="forgot" onclick="return false;">Forgot password?</a>
            </div>

            <div id="message" class="message">
                ⚠️ <strong>تنبيه — هذه صفحة تجريبية توعوية.</strong>
                <br>
                لا تقم بإدخال معلومات حساسة أو كلمات مرور الحسابات الحقيقية على مواقع غير متحقق منها.
            </div>

            <!-- Integrated Awareness Section -->
            <div class="training-note-container">
                <div class="training-note">
                    This page is part of a cybersecurity awareness demonstration.
                    <br>
                    Do not use real account information.
                </div>
            </div>

        </div>

        <!-- Outer Footer -->
        <div class="footer">
            Educational Training Demo
        </div>

    </div>
</div>

<script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
        event.preventDefault();

        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");

        /*
           Training purpose only:
           Securely clearing inputs, NO data is processed.
        */

        document.getElementById("message").style.display = "block";

        usernameInput.value = "";
        passwordInput.value = "";
    });
</script>

</body>
</html>
