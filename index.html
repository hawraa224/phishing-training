<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhotoShare - Training Demo</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fafafa;
    color: #262626;
}

.container {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 350px;
    text-align: center;
}

.card {
    background: white;
    border: 1px solid #dbdbdb;
    padding: 35px 35px 25px;
    border-radius: 4px;
}

.logo-icon {
    width: 70px;
    height: 70px;
    margin: 0 auto 15px;
    border-radius: 20px;
    background: linear-gradient(
        135deg,
        #833ab4,
        #fd1d1d,
        #fcb045
    );
    position: relative;
}

.logo-icon::before {
    content: "";
    position: absolute;
    width: 34px;
    height: 34px;
    border: 3px solid white;
    border-radius: 10px;
    left: 15px;
    top: 15px;
}

.logo-icon::after {
    content: "";
    position: absolute;
    width: 7px;
    height: 7px;
    background: white;
    border-radius: 50%;
    right: 13px;
    top: 13px;
}

h1 {
    font-size: 28px;
    margin: 5px 0 25px;
    font-weight: 600;
}

input {
    width: 100%;
    padding: 11px;
    margin-bottom: 8px;
    border: 1px solid #dbdbdb;
    border-radius: 4px;
    background: #fafafa;
    font-size: 12px;
}

button {
    width: 100%;
    border: none;
    border-radius: 6px;
    padding: 10px;
    margin-top: 8px;
    background: #3897f0;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #287dc1;
}

.forgot {
    display: block;
    margin-top: 18px;
    font-size: 12px;
    color: #385185;
    text-decoration: none;
}

.message {
    display: none;
    margin-top: 18px;
    padding: 14px;
    border-radius: 6px;
    background: #fff3cd;
    border: 1px solid #ffe69c;
    color: #664d03;
    font-size: 13px;
    line-height: 1.5;
}

.training-note {
    margin-top: 18px;
    font-size: 11px;
    color: #777;
    line-height: 1.5;
}

.footer {
    margin-top: 20px;
    font-size: 11px;
    color: #999;
}
</style>
</head>

<body>

<div class="container">

    <div class="login-box">

        <div class="card">

            <div class="logo-icon"></div>

            <h1>PhotoShare</h1>

            <form id="loginForm">

                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    autocomplete="off"
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    autocomplete="off"
                >

                <button type="submit">
                    Log In
                </button>

            </form>

            <a href="#" class="forgot" onclick="return false;">
                Forgot password?
            </a>

            <div id="message" class="message">
                ⚠️ <strong>STOP — This is a training page.</strong>
                <br><br>
                Never enter a real password before verifying the website.
            </div>

            <div class="training-note">
                This page is part of a cybersecurity awareness demonstration.
                <br>
                Do not use real account information.
            </div>

        </div>

        <div class="footer">
            Educational Training Demo
        </div>

    </div>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const username = document.getElementById("username");

    /*
       Training purpose only:
       The password is NOT read, stored, transmitted,
       or sent anywhere.
    */

    document.getElementById("message").style.display = "block";

    username.value = "";
});
</script>

</body>
</html>
